<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Cadle</title>
    <meta
      name="description"
      content="Create electrical ground plans and AREI one-wire diagrams with Cadle." />
    <link
      rel="stylesheet"
      href="./themes/default/theme.css"
      media="print"
      onload="this.media = 'all'" />
    <noscript
      ><link
        rel="stylesheet"
        href="./themes/default/theme.css"
    /></noscript>
  </head>
  <body>
    <style>
      app-shell,
      projects-field,
      cadle-app,
      body,
      html {
        height: 100%;
        overflow: hidden;
        contain: strict;
      }

      body,
      html {
        padding: 0;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        font-size: 14px;
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
        background: var(--md-sys-color-background);
        color: var(--md-sys-color-on-background);
      }

      app-shell:not(:defined),
      projects-field:not(:defined) {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: clamp(24px, 5vw, 72px);
        background: #fffbff;
        color: #211a1d;
      }

      @media (prefers-color-scheme: dark) {
        app-shell:not(:defined),
        projects-field:not(:defined) {
          background: #151112;
          color: #f5e9ec;
        }

      }

      @media (max-width: 900px) {
        app-shell:not(:defined),
        projects-field:not(:defined) {
          place-items: start center;
          overflow-y: auto;
        }

      }

      @media (max-width: 560px) {
        app-shell:not(:defined),
        projects-field:not(:defined) {
          padding: 20px 16px 32px;
        }

      }
    </style>

    <projects-field> </projects-field>

    <script
      src="./bootstrap.js"
      type="module"></script>
  </body>
</html>
