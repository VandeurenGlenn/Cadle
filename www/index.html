<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Cadle</title>
    <meta
      name="description"
      content="Create electrical ground plans and AREI one-wire diagrams with Cadle." />
    <link
      rel="stylesheet"
      href="./themes/default/theme.css"
      media="print"
      onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="./themes/default/theme.css" /></noscript>
  </head>
  <body>
    <style>
      app-shell,
      cadle-app,
      body,
      html {
        height: 100%;
        overflow: hidden;
        contain: strict;
      }

      body,
      html {
        padding: 0;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        font-size: 14px;
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
        background: var(--md-sys-color-background);
        color: var(--md-sys-color-on-background);
      }

      app-shell:not(:defined) {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: clamp(24px, 5vw, 72px);
        background: #fffbff;
        color: #211a1d;
      }

      .boot-landing {
        display: grid;
        grid-template-columns: minmax(0, 1.12fr) minmax(360px, 0.88fr);
        align-items: center;
        gap: clamp(36px, 7vw, 104px);
        width: min(1180px, 100%);
      }

      .boot-hero small {
        display: inline-block;
        padding: 7px 12px;
        border: 1px solid #d8c2ca;
        border-radius: 999px;
        color: #514347;
      }

      .boot-hero h1 {
        margin: 28px 0 0;
        font-size: clamp(42px, 5.4vw, 76px);
        line-height: 0.98;
        letter-spacing: -0.045em;
      }

      .boot-hero > p {
        max-width: 540px;
        margin: 20px 0 0;
        color: #514347;
        font-size: 17px;
        line-height: 1.6;
      }

      .boot-mobile-brand {
        display: none;
      }

      .boot-plan {
        display: block;
        width: min(560px, 100%);
        margin-top: 8px;
      }

      .boot-plan rect {
        fill: #fff7fa;
        stroke: #d8c2ca;
      }

      .boot-plan path {
        fill: none;
        stroke: #514347;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        animation: boot-draw 1.2s ease both;
      }

      .boot-plan path:nth-of-type(2) {
        animation-delay: 0.2s;
      }

      .boot-plan path:nth-of-type(3) {
        animation-delay: 0.4s;
      }

      .boot-projects {
        width: 100%;
        box-sizing: border-box;
        padding: clamp(22px, 3vw, 34px);
        border: 1px solid #d8c2ca;
        border-radius: 24px;
        background: #fff7fa;
        box-shadow: 0 8px 30px rgb(0 0 0 / 10%);
      }

      .boot-projects h1,
      .boot-projects p {
        margin: 0;
      }

      .boot-projects p {
        margin-top: 8px;
        color: #514347;
      }

      .boot-projects-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 24px;
      }

      .boot-projects a {
        padding: 10px 18px;
        border-radius: 20px;
        background: #8b4a62;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      @keyframes boot-draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @media (prefers-color-scheme: dark) {
        app-shell:not(:defined) {
          background: #151112;
          color: #f5e9ec;
        }

        .boot-projects,
        .boot-plan rect {
          background: #241d1f;
          fill: #241d1f;
          border-color: #514347;
          stroke: #514347;
        }

        .boot-hero small,
        .boot-hero > p,
        .boot-projects p {
          color: #d7c1c7;
        }

        .boot-plan path {
          stroke: #f5e9ec;
        }
      }

      @media (max-width: 900px) {
        app-shell:not(:defined) {
          place-items: start center;
          overflow-y: auto;
        }

        .boot-landing {
          grid-template-columns: 1fr;
          width: min(620px, 100%);
          text-align: center;
        }

        .boot-hero > p,
        .boot-plan {
          margin-inline: auto;
        }
      }

      @media (max-width: 560px) {
        app-shell:not(:defined) {
          padding: 20px 16px 32px;
        }

        .boot-landing {
          gap: 20px;
        }

        .boot-hero h1,
        .boot-hero > p,
        .boot-plan {
          display: none;
        }

        .boot-mobile-brand {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          margin-top: 18px;
          font-size: 34px;
          font-weight: 720;
          letter-spacing: -0.04em;
        }

        .boot-mobile-brand svg {
          width: 58px;
          height: 58px;
        }

        .boot-mobile-brand .brand-plan {
          fill: none;
          stroke: currentColor;
          stroke-width: 4;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        .boot-mobile-brand .brand-circuit {
          fill: none;
          stroke: #8b4a62;
          stroke-width: 2.5;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        .boot-mobile-brand circle {
          fill: #fff7fa;
          stroke: #8b4a62;
          stroke-width: 2.5;
        }

        .boot-mobile-brand .brand-pencil {
          fill: #8b4a62;
          stroke: #fff;
          stroke-width: 1.5;
          stroke-linejoin: round;
        }

        .boot-projects {
          border-radius: 20px;
          padding: 22px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-plan path {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>

    <app-shell>
      <main class="boot-landing">
        <section class="boot-hero">
          <small>Built for Belgian electrical plans</small>
          <div class="boot-mobile-brand" aria-label="Cadle">
            <svg
              viewBox="0 0 72 72"
              aria-hidden="true">
              <path
                class="brand-plan"
                d="M55 18H22a7 7 0 0 0-7 7v29h26V39h14"></path>
              <path
                class="brand-circuit"
                d="M23 30h18v17h14"></path>
              <circle
                cx="23"
                cy="30"
                r="4"></circle>
              <circle
                cx="41"
                cy="47"
                r="4"></circle>
              <path
                class="brand-pencil"
                d="m49 15 8 8-18 18-10 2 2-10Z"></path>
            </svg>
            <span>Cadle</span>
          </div>
          <h1>From ground plan<br />to one-wire.</h1>
          <p>Draw naturally, connect your circuits, and let Cadle keep the technical structure clear.</p>
          <svg
            class="boot-plan"
            viewBox="0 0 520 280"
            aria-hidden="true">
            <rect
              x="42"
              y="20"
              width="436"
              height="236"
              rx="20"></rect>
            <path
              pathLength="1"
              d="M92 64H270V154H92Z"></path>
            <path
              pathLength="1"
              d="M270 64H426V128H270"></path>
            <path
              pathLength="1"
              d="M92 154V218H226V154M226 218H426V128"></path>
          </svg>
        </section>
        <section class="boot-projects">
          <h1>Projects</h1>
          <p>Open an existing Cadle project or start a new electrical plan.</p>
          <div class="boot-projects-actions">
            <a href="#!/create-project">Create project</a>
          </div>
        </section>
      </main>
    </app-shell>

    <script
      src="./shell.js"
      type="module"></script>
  </body>
</html>
