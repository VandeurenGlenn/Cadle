<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Cadle</title>
    <meta
      name="description"
      content="Create electrical ground plans and AREI one-wire diagrams with Cadle." />
    <link
      rel="stylesheet"
      href="./themes/default/theme.css"
      media="print"
      onload="this.media = 'all'" />
    <noscript
      ><link
        rel="stylesheet"
        href="./themes/default/theme.css"
    /></noscript>
  </head>
  <body>
    <style>
      app-shell,
      projects-field,
      cadle-app,
      body,
      html {
        height: 100%;
        overflow: hidden;
        contain: strict;
      }

      body,
      html {
        padding: 0;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        font-size: 14px;
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
        background: var(--md-sys-color-background);
        color: var(--md-sys-color-on-background);
      }

      app-shell:not(:defined),
      projects-field:not(:defined) {
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: clamp(24px, 5vw, 72px);
        background: #fffbff;
        color: #211a1d;
      }

      .boot-landing {
        width: min(620px, 100%);
      }

      .boot-projects {
        width: 100%;
        box-sizing: border-box;
        padding: 24px;
        border: 1px solid #d8c2ca;
        border-radius: 20px;
        background: #fff7fa;
        box-shadow: 0 8px 30px rgb(0 0 0 / 10%);
      }

      .boot-projects h1,
      .boot-projects p {
        margin: 0;
      }

      .boot-projects p {
        margin-top: 8px;
        color: #514347;
      }

      .boot-projects-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 24px;
      }

      .boot-projects a {
        padding: 10px 18px;
        border-radius: 20px;
        background: #8b4a62;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        app-shell:not(:defined),
        projects-field:not(:defined) {
          background: #151112;
          color: #f5e9ec;
        }

        .boot-projects {
          background: #241d1f;
          border-color: #514347;
        }

        .boot-projects p {
          color: #d7c1c7;
        }
      }

      @media (max-width: 900px) {
        app-shell:not(:defined),
        projects-field:not(:defined) {
          place-items: start center;
          overflow-y: auto;
        }

        .boot-landing {
          width: min(620px, 100%);
        }
      }

      @media (max-width: 560px) {
        app-shell:not(:defined),
        projects-field:not(:defined) {
          padding: 20px 16px 32px;
        }

        .boot-projects {
          padding: 22px;
        }
      }

    </style>

    <projects-field>
      <main class="boot-landing">
        <section class="boot-projects">
          <h1>Projects</h1>
          <p>Open an existing Cadle project or start a new electrical plan.</p>
          <div class="boot-projects-actions">
            <a href="#!/create-project">Create project</a>
          </div>
        </section>
      </main>
    </projects-field>

    <script
      src="./bootstrap.js"
      type="module"></script>
  </body>
</html>
